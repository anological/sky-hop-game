<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SKY HOP</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#050510; font-family:'Segoe UI', system-ui, sans-serif; }
  #game { display:block; position:absolute; inset:0; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             text-align:center; color:#fff; z-index:10; pointer-events:none; transition:opacity .25s; }
  .overlay.hidden { opacity:0; }
  h1.title { font-size:clamp(48px, 12vw, 110px); font-weight:900; letter-spacing:.12em;
             color:#00f0ff; text-shadow:0 0 18px #00f0ff, 0 0 60px #00f0ff88; }
  h1.title span { color:#ff2fd6; text-shadow:0 0 18px #ff2fd6, 0 0 60px #ff2fd688; }
  .sub { margin-top:10px; font-size:clamp(14px,3vw,20px); letter-spacing:.35em; color:#8f9bb3; text-transform:uppercase; }
  .prompt { margin-top:34px; font-size:clamp(16px,3.4vw,22px); letter-spacing:.2em; color:#ffe14d;
            text-shadow:0 0 12px #ffe14d88; animation:blink 1.1s infinite; text-transform:uppercase; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
  .stats { margin-top:26px; font-size:clamp(14px,3vw,18px); letter-spacing:.25em; color:#8f9bb3; text-transform:uppercase; }
  .stats b { color:#fff; text-shadow:0 0 10px #00f0ff; }
  #hud { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
         padding:18px 22px; z-index:10; pointer-events:none; color:#fff; }
  #hud .score { font-size:clamp(28px,6vw,46px); font-weight:800; color:#fff; text-shadow:0 0 14px #00f0ff; }
  #hud .meta { text-align:right; font-size:clamp(11px,2.4vw,14px); letter-spacing:.2em; color:#8f9bb3; text-transform:uppercase; line-height:1.9; }
  #hud .meta b { color:#ffe14d; text-shadow:0 0 8px #ffe14d88; }
  #newbest { margin-top:14px; font-size:clamp(18px,4vw,28px); font-weight:800; letter-spacing:.3em; color:#ffe14d;
             text-shadow:0 0 16px #ffe14d; text-transform:uppercase; animation:blink .8s infinite; }
  #finalscore { font-size:clamp(40px,10vw,84px); font-weight:900; color:#fff; text-shadow:0 0 20px #ff2fd6; margin-top:6px; }
  .hint { position:absolute; bottom:26px; left:0; right:0; text-align:center; z-index:10; pointer-events:none;
          color:#5a6580; font-size:13px; letter-spacing:.25em; text-transform:uppercase; }
  #mutebtn { position:absolute; bottom:20px; right:20px; z-index:20; background:#0b0b1ecc; border:1px solid #00f0ff66;
             color:#00f0ff; font-size:18px; width:44px; height:44px; border-radius:10px; cursor:pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden" style="display:none">
  <div class="score" id="score">0</div>
  <div class="meta">HIGH <b id="high">0</b><br>SPEED <b id="speed">×1.0</b></div>
</div>

<div id="title" class="overlay">
  <h1 class="title">SKY <span>HOP</span></h1>
  <div class="sub">neon arcade flyer</div>
  <div class="prompt">tap / click / space to fly</div>
  <div class="stats">BEST&nbsp;<b id="titleHigh">0</b></div>
</div>

<div id="over" class="overlay hidden">
  <div class="sub">game over</div>
  <div id="finalscore">0</div>
  <div id="newbest" class="hidden" style="display:none">★ new best ★</div>
  <div class="stats">BEST&nbsp;<b id="overHigh">0</b></div>
  <div class="prompt">tap to fly again</div>
</div>

<div class="hint">space / click / tap = hop</div>
<button id="mutebtn" title="mute">♪</button>

<script>
(() => {
"use strict";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const ui = { hud:$('hud'), title:$('title'), over:$('over'), score:$('score'), high:$('high'),
             speed:$('speed'), titleHigh:$('titleHigh'), overHigh:$('overHigh'),
             final:$('finalscore'), newbest:$('newbest'), mute:$('mutebtn') };

let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

/* ---------- audio (tiny synth) ---------- */
let AC=null, muted=false;
function beep(freq, dur, type='square', vol=0.05){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
ui.mute.addEventListener('click', e=>{ e.stopPropagation(); muted=!muted; ui.mute.textContent = muted?'✕':'♪'; });

/* ---------- state ---------- */
const HS_KEY='skyhop_high';
let high = parseInt(localStorage.getItem(HS_KEY)||'0',10)||0;
let state='title';           // title | play | dead
let score=0, speed=0, baseSpeed=0, elapsed=0;
let pillars=[], particles=[], popups=[], stars=[];
let shake=0, flashA=0, deadT=0;

const player = { x:0, y:0, vy:0, r:13 };

function initStars(){
  stars=[];
  for(let i=0;i<110;i++) stars.push({x:Math.random()*W, y:Math.random()*H,
    z:Math.random()*0.8+0.2, s:Math.random()*1.8+0.4});
}
initStars();

function reset(){
  player.x = Math.min(W*0.32, 220);
  player.y = H*0.45; player.vy = 0;
  pillars=[]; particles=[]; popups=[];
  score=0; elapsed=0; shake=0; flashA=0;
  baseSpeed = Math.max(230, W*0.28);   // px/sec, scales a bit with screen
  speed = baseSpeed;
  updateHUD();
}

function speedMult(){ return speed/baseSpeed; }

function spawnPillar(){
  const gap = Math.max(150, 200 - score*1.2);
  const margin = 90;
  const cy = margin + gap/2 + Math.random()*(H - 2*margin - gap);
  const w = Math.max(56, W*0.075);
  const mover = speedMult() > 1.6 && Math.random() < 0.35;  // some pillars drift vertically late-game
  pillars.push({ x:W+40, w, gapY:cy, gapH:gap, passed:false,
                 mover, vy:(Math.random()<0.5?-1:1)*(40+speed*0.12), hue: Math.random()<0.5?'0,240,255':'255,47,214' });
}

function hop(){
  if(state==='title'){ startGame(); return; }
  if(state==='dead'){ if(deadT>0.6) startGame(); return; }
  player.vy = -Math.max(430, H*0.62);
  burst(player.x-10, player.y+8, 8, '0,240,255');
  beep(520, 0.07, 'square', 0.04);
}

function startGame(){
  reset();
  state='play';
  ui.title.classList.add('hidden');
  ui.over.classList.add('hidden');
  ui.hud.style.display='flex';
  player.vy = -Math.max(430, H*0.62);
}

function die(){
  state='dead'; deadT=0;
  shake=14; flashA=0.55;
  burst(player.x, player.y, 46, '255,47,214');
  burst(player.x, player.y, 26, '0,240,255');
  beep(160, 0.35, 'sawtooth', 0.07);
  const isBest = score>high;
  if(isBest){ high=score; localStorage.setItem(HS_KEY, String(high)); }
  ui.final.textContent=score;
  ui.overHigh.textContent=high;
  ui.titleHigh.textContent=high;
  ui.high.textContent=high;
  ui.newbest.style.display = isBest?'block':'none';
  setTimeout(()=>{ if(state==='dead') ui.over.classList.remove('hidden'); }, 450);
}

function burst(x,y,n,rgb){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=60+Math.random()*260;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.5+Math.random()*0.5,t:0,rgb,r:1.5+Math.random()*2.5});
  }
}
function popup(x,y,txt,rgb){ popups.push({x,y,txt,t:0,rgb}); }

function updateHUD(){
  ui.score.textContent=score;
  ui.high.textContent=high;
  ui.speed.textContent='×'+speedMult().toFixed(1);
}

/* ---------- input ---------- */
window.addEventListener('pointerdown', e=>{ if(e.target===ui.mute) return; hop(); });
window.addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); hop(); }
});
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && state==='play'){ /* soft pause: freeze */ last=performance.now(); } });

/* ---------- loop ---------- */
let last=performance.now(), spawnT=0;
function frame(now){
  let dt=Math.min((now-last)/1000, 0.05); last=now;

  // background
  ctx.fillStyle='#050510'; ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake*=0.88; if(shake<0.4)shake=0; }

  // stars (parallax)
  for(const s of stars){
    s.x -= speed*s.z*0.25*dt + 12*s.z*dt;
    if(s.x<0){ s.x=W; s.y=Math.random()*H; }
    ctx.fillStyle=`rgba(180,200,255,${0.25+s.z*0.5})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  if(state==='play'){
    elapsed+=dt;
    // speed ramps with score AND time — no mercy
    speed = Math.min(baseSpeed*2.6, baseSpeed + score*14 + elapsed*6);

    // physics
    player.vy += Math.max(1250, H*1.9)*dt;
    player.vy = Math.min(player.vy, 900);
    player.y += player.vy*dt;

    // trail
    if(Math.random()<0.8) particles.push({x:player.x-12, y:player.y+(Math.random()-0.5)*8,
      vx:-speed*0.35, vy:(Math.random()-0.5)*40, life:0.35, t:0, rgb:'0,240,255', r:2});

    // spawn pillars
    spawnT-=dt;
    if(spawnT<=0){ spawnPillar(); spawnT = Math.max(0.85, 1.55 - speedMult()*0.22); }

    // pillars
    const px=player.x, py=player.y, pr=player.r;
    for(let i=pillars.length-1;i>=0;i--){
      const p=pillars[i];
      p.x -= speed*dt;
      if(p.mover){ p.gapY += p.vy*dt; if(p.gapY<p.gapH/2+70||p.gapY>H-p.gapH/2-70) p.vy*=-1; }
      if(p.x+p.w<-20){ pillars.splice(i,1); continue; }
      if(!p.passed && p.x+p.w < px){ p.passed=true; score++;
        popup(px+30, py-24, '+1', '255,225,77'); beep(760+Math.min(score*8,400), 0.08, 'square', 0.045); updateHUD(); }

      // draw neon pillar
      const topH=p.gapY-p.gapH/2, botY=p.gapY+p.gapH/2;
      ctx.save();
      ctx.shadowColor=`rgba(${p.hue},0.9)`; ctx.shadowBlur=16;
      ctx.fillStyle=`rgba(${p.hue},0.16)`;
      roundRect(p.x, -20, p.w, topH+20, 8); ctx.fill();
      roundRect(p.x, botY, p.w, H-botY+20, 8); ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle=`rgba(${p.hue},0.95)`; ctx.lineWidth=2.5;
      roundRect(p.x, -20, p.w, topH+20, 8); ctx.stroke();
      roundRect(p.x, botY, p.w, H-botY+20, 8); ctx.stroke();
      // glowing gap edges
      ctx.fillStyle=`rgba(${p.hue},1)`;
      ctx.fillRect(p.x-3, topH-4, p.w+6, 5);
      ctx.fillRect(p.x-3, botY-1, p.w+6, 5);
      ctx.restore();

      // collision
      if(px+pr>p.x && px-pr<p.x+p.w && (py-pr<topH || py+pr>botY)){ die(); break; }
    }

    // ceiling / floor
    if(py-pr<0 || py+pr>H){ die(); }

    // speed lines at high velocity
    if(speedMult()>1.7){
      ctx.strokeStyle='rgba(0,240,255,0.18)'; ctx.lineWidth=2;
      for(let k=0;k<8;k++){
        const y=Math.random()*H, x=Math.random()*W, l=60+Math.random()*120;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+l,y); ctx.stroke();
      }
    }
  }

  if(state==='dead'){ deadT+=dt; }

  // idle bob on title
  if(state==='title'){
    player.x = Math.min(W*0.32, 220); player.y = H*0.45 + Math.sin(now/500)*14;
  }

  // player ship (drawn in play + dead-but-visible)
  if(state!=='title' || true){
    const tilt = state==='play' ? Math.max(-0.5, Math.min(0.6, player.vy/1400)) : Math.sin(now/500)*0.08;
    ctx.save();
    ctx.translate(player.x, player.y); ctx.rotate(tilt);
    ctx.shadowColor='#00f0ff'; ctx.shadowBlur=22;
    const g=ctx.createLinearGradient(-14,0,16,0);
    g.addColorStop(0,'#ff2fd6'); g.addColorStop(1,'#00f0ff');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(18,0); ctx.lineTo(-12,-11); ctx.lineTo(-6,0); ctx.lineTo(-12,11);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(2,0,3.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.t+=dt;
    if(p.t>=p.life){ particles.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*dt;
    ctx.fillStyle=`rgba(${p.rgb},${1-p.t/p.life})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  // popups
  ctx.textAlign='center'; ctx.font='bold 22px sans-serif';
  for(let i=popups.length-1;i>=0;i--){
    const p=popups[i]; p.t+=dt;
    if(p.t>0.8){ popups.splice(i,1); continue; }
    ctx.fillStyle=`rgba(${p.rgb},${1-p.t/0.8})`;
    ctx.fillText(p.txt, p.x, p.y-p.t*60);
  }

  ctx.restore();

  // death flash
  if(flashA>0){ ctx.fillStyle=`rgba(255,47,214,${flashA})`; ctx.fillRect(0,0,W,H); flashA-=dt*1.6; }

  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,10,0.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  requestAnimationFrame(frame);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

ui.titleHigh.textContent=high;
reset();
state='title';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
