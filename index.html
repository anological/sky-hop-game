<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151018">
  <title>Sky Hop | Rahul Gaba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sky-hop.css">
</head>
<body>
  <main class="game-page">
    <a class="back" href="index.html">← Portfolio</a>
    <section class="game-shell">
      <header><p>ORIGINAL ARCADE GAME</p><h1>SKY <span>HOP</span></h1><small>Tap, click, or press Space to fly</small></header>
      <div class="game-frame"><canvas id="game" width="420" height="620" aria-label="Sky Hop game"></canvas><div class="overlay" id="overlay"><b id="message">READY?</b><span id="hint">Tap to start</span></div></div>
      <div class="score-row"><div><span>Score</span><strong id="score">0</strong></div><div><span>Best</span><strong id="best">0</strong></div></div>
      <p class="instructions">Guide the neon flyer through the gates. Each gate is one point.</p>
    </section>
  </main>
  <script src="sky-hop.js"></script>
</body>
</html>
